# Public roadmap: ROADMAP.md + GitHub Pages site, rebuilt from issues and Discussions (votes = 👍 / upvotes)
name: Roadmap
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  discussion:
    types: [created, edited, closed, reopened, deleted]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 */3 * * *"   # reactions do not trigger events - refresh vote counts every 3 h
  workflow_dispatch:
permissions:
  contents: write
  issues: read
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: roadmap
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/roadmap.py
      - name: Commit ROADMAP.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git diff --cached --quiet || (git commit -m "Roadmap: update" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages (works once Pages is set to "GitHub Actions" in Settings)
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
