# Idea → issue → done: approving an idea (label "status: approved" on the discussion) creates a linked issue;
# closing that issue marks the idea done. See tools/idea_flow.py and CONTRIBUTING.md.
name: Idea flow
on:
  discussion:
    types: [labeled]
  issues:
    types: [closed, reopened, labeled]
permissions:
  contents: read
  issues: write
  discussions: write
jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/idea_flow.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
