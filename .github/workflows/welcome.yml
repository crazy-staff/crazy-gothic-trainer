# New discussion from someone else -> short reply on how it works; ideas get "status: pending"
name: Discussions welcome
on:
  discussion:
    types: [created]
permissions:
  discussions: write
  issues: read
jobs:
  hello:
    if: github.event.discussion.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const d = context.payload.discussion;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const pl = (t) => `\n\n<details><summary>🇵🇱 Po polsku</summary>\n\n${t}\n</details>`;
            const body = d.category.slug === 'ideas'
              ? `Thanks for the idea! It is already on the [roadmap](${base}/blob/main/ROADMAP.md) — others can vote for it with the up arrow or 👍. At the next review it gets a category label and a status (if a very similar idea exists, I will link it here).`
                + pl('Dzięki za pomysł! Już jest na mapie drogowej — inni mogą na niego głosować strzałką w górę lub 👍. Przy najbliższym przeglądzie dostanie etykietę kategorii i status.')
              : `Thanks! If this is a feature idea, do not worry about the category — it will be moved to [Ideas](${base}/discussions/categories/ideas) at the next review. Bugs are best reported from the in-game Tester hub or in Issues.`
                + pl('Dzięki! Jeśli to pomysł na funkcję, nie przejmuj się kategorią — przy przeglądzie przeniosę go do Pomysłów. Błędy najlepiej zgłaszać z Centrum testera w grze albo w Issues.');
            if (d.category.slug === 'ideas') {
              const l = await github.rest.issues.getLabel({ ...context.repo, name: 'status: pending' });
              await github.graphql(`mutation($i:ID!,$l:[ID!]!){addLabelsToLabelable(input:{labelableId:$i,labelIds:$l}){clientMutationId}}`, { i: d.node_id, l: [l.data.node_id] });
            }
            await github.graphql(`mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{id}}}`, { d: d.node_id, b: body });
