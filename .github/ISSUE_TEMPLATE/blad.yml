# File name and field ids are used by the in-game tester hub (prefilled links) - do not rename them.
name: Bug report
description: Something does not work or works wrong. Easiest from the game (Tester hub → flag next to an option). PL - błąd.
title: ""
labels: ["type: bug", "status: needs verification"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! When sent from the game, the fields are already filled in — check them and click **Submit new issue**.
        Please look at the [open issues](https://github.com/dawidseipold/gothic1-crazy-trainer/issues) first — if it is already there, add 👍 and a comment.
        _PL: Możesz pisać po polsku — pola po angielsku, treść w dowolnym języku._
  - type: input
    id: opcja
    attributes:
      label: What is it about
      description: Option name from the menu (its ID in brackets, e.g. `rain`) or "general". PL - czego dotyczy.
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Loaded a save in the Old Camp
        2. Turned on ...
    validations:
      required: true
  - type: textarea
    id: oczekiwane
    attributes:
      label: Expected result
  - type: textarea
    id: faktyczne
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: waga
    attributes:
      label: Severity
      placeholder: minor / annoying / blocks the game
  - type: input
    id: powtarzalnosc
    attributes:
      label: How often
      placeholder: always / often / sometimes / once
  - type: input
    id: build
    attributes:
      label: Trainer build
      description: Number shown in the menu (Settings) or in the release file name.
    validations:
      required: true
  - type: input
    id: tester
    attributes:
      label: Your nickname
  - type: textarea
    id: kontekst
    attributes:
      label: Game context (automatic)
      description: Game state, enabled options and recent events — filled in automatically when sent from the game.
      render: text
  - type: textarea
    id: zalaczniki
    attributes:
      label: Report / screenshots
      description: Drag the report file from the `G1CrazyTrainer_raporty` folder here (Tester hub → Send → Export) and any screenshots.
  - type: input
    id: uid
    attributes:
      label: Ticket ID (from the game)
      description: Do not change — links this issue with the report.
