# File name and field ids are used by the in-game tester hub (prefilled links) - do not rename them.
name: Crash (the game closed)
description: The game closed or froze. After a crash the trainer prepares a draft in the Tester hub.
title: "[Crash] "
labels: ["type: crash", "status: needs verification"]
body:
  - type: markdown
    attributes:
      value: |
        **Please write in English** — the only language of this repository ([rules](https://github.com/dawidseipold/gothic1-crazy-trainer/blob/main/CONTRIBUTING.md)).
        **The report file matters most.** In the game: Tester hub → Send → *Export unsent*, then drag the file from the `G1CrazyTrainer_raporty` folder into the "Report" field below.
        Without the game: attach `G1CrazyTrainer.log` and `G1CrazyTrainer_crashes.txt` from `Gothic\system\Autorun`.
  - type: input
    id: opcja
    attributes:
      label: What was on / what were you doing when it crashed
    validations:
      required: true
  - type: textarea
    id: kroki
    attributes:
      label: Steps
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: faktyczne
    attributes:
      label: What happened
      placeholder: closed without a message / froze / error message ...
  - type: input
    id: powtarzalnosc
    attributes:
      label: How often
      placeholder: always / often / sometimes / once
  - type: input
    id: build
    attributes:
      label: Trainer build
    validations:
      required: true
  - type: input
    id: tester
    attributes:
      label: Your nickname
  - type: textarea
    id: kontekst
    attributes:
      label: Game context (automatic)
      render: text
  - type: textarea
    id: zalaczniki
    attributes:
      label: Report
      description: Drag the report file here (required for crashes).
    validations:
      required: true
  - type: input
    id: oczekiwane
    attributes:
      label: (optional) expected result
  - type: input
    id: waga
    attributes:
      label: Severity
      value: blocks the game
  - type: input
    id: uid
    attributes:
      label: Ticket ID (from the game)
