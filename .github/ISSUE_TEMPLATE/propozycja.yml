name: Propozycja
description: Zmiana w istniejącej opcji. Zupełnie nowe funkcje → Dyskusje (Pomysły).
title: "[Propozycja] "
labels: ["propozycja"]
body:
  - type: markdown
    attributes:
      value: "Ten formularz jest na zmiany w istniejących opcjach. Nowe funkcje zbieramy w [Dyskusjach](https://github.com/dawidseipold/gothic1-crazy-trainer/discussions/categories/ideas) — tam zagłosuj na podobny pomysł albo załóż nowy wątek."
  - type: input
    id: opcja
    attributes:
      label: Czego dotyczy
      description: Istniejąca opcja (z ID) albo „nowa funkcja”.
  - type: textarea
    id: opis
    attributes:
      label: Opis pomysłu
      description: Co ma robić i jak ma wyglądać w menu.
    validations:
      required: true
  - type: textarea
    id: dlaczego
    attributes:
      label: Po co / dla kogo
  - type: input
    id: build
    attributes:
      label: Build trainera
  - type: input
    id: tester
    attributes:
      label: Twój nick
  - type: textarea
    id: kontekst
    attributes:
      label: Kontekst z gry (automatycznie)
      render: text
  - type: input
    id: uid
    attributes:
      label: ID zgłoszenia (z gry)
