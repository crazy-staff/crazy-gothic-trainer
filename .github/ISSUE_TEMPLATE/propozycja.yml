# File name and field ids are used by the in-game tester hub (prefilled links) - do not rename them.
name: Change to an existing option
description: Change or extend something that already exists. Brand-new features → Discussions (Ideas).
title: "[Suggestion] "
labels: ["type: enhancement"]
body:
  - type: markdown
    attributes:
      value: "**Please write in English** — the only language of this repository ([rules](https://github.com/dawidseipold/gothic1-crazy-trainer/blob/main/CONTRIBUTING.md)). This form is for changes to existing options. New features are collected in [Discussions](https://github.com/dawidseipold/gothic1-crazy-trainer/discussions/categories/ideas) — vote for a similar idea there or start a new thread."
  - type: input
    id: opcja
    attributes:
      label: What is it about
      description: Existing option (with ID) or "new feature".
  - type: textarea
    id: opis
    attributes:
      label: Description
      description: What it should do and how it should look in the menu.
    validations:
      required: true
  - type: textarea
    id: dlaczego
    attributes:
      label: Why / who is it for
  - type: input
    id: build
    attributes:
      label: Trainer build
  - type: input
    id: tester
    attributes:
      label: Your nickname
  - type: textarea
    id: kontekst
    attributes:
      label: Game context (automatic)
      render: text
  - type: input
    id: uid
    attributes:
      label: Ticket ID (from the game)
